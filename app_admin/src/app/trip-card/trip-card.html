<div class="card">
  <div class="card-header">
    {{ trip.name }}
  </div>

  <img
    [src]="trip.image.toLowerCase().replace('/images', 'assets/images')"
    alt="trip thumbnail"
    class="card-img-top"
  />

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only {{ trip.perPerson }} per person
    </p>

    <p class="card-text">
      {{ trip.description }}
    </p>

    <a
      class="btn btn-primary"
      [routerLink]="['/edit-trip', trip.code]">
      Edit Trip
    </a>

    <button
      type="button"
      class="btn btn-danger"
      (click)="deleteTrip()">
      Delete Trip
    </button>
  </div>
</div>
